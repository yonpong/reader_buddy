<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Könyvértékelések & AI Ajánló</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f5f7;
      color: #18181b;
      padding: 20px;
      line-height: 1.45;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .box {
      background: #fff;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
      padding: 16px;
    }
    h1, h2 { margin: 0 0 8px; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; }
    textarea, input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #a1a1aa;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; }
    button {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #18181b;
      background: #18181b;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #27272a; }
    button.sec {
      background: #fff;
      color: #18181b;
      border-color: #a1a1aa;
    }
    button.sec:hover { background: #f4f4f5; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
    .book {
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }
    .book-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
    .meta { font-size: 12px; color: #52525b; margin-top: 2px; }
    .review { margin-top: 8px; white-space: pre-line; font-size: 14px; }
    .ai-out {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #f4f4f5;
      border: 1px solid #d4d4d8;
      white-space: pre-line;
      font-size: 14px;
    }
    .msg { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h1>Könyvértékeléseim & AI Ajánló</h1>
    <div class="row">
      <input type="password" id="apiKeyInput" placeholder="Gemini API kulcs (AIza...)" style="max-width:320px;" />
      <button type="button" id="saveKeyBtn">Kulcs mentése</button>
      <button type="button" class="sec" id="exportBtn">JSON mentés</button>
      <button type="button" class="sec" id="importBtn">JSON betöltés</button>
      <input type="file" id="importFile" accept=".json" style="display:none;" />
      <span id="keyStatus" class="msg"></span>
    </div>
  </div>

  <!-- MOLY BEILLESZTŐ -->
  <div class="box">
    <h2>Moly értékelés beillesztése</h2>
    <textarea id="molyInput" rows="5" placeholder="Másold ki a Moly.hu-ról az értékelést és illeszd ide..."></textarea>
    <div class="row">
      <button type="button" id="addMolyBtn">Beírás a könyveim közé</button>
      <span id="molyStatus" class="msg"></span>
    </div>
  </div>

  <div class="grid2">
    <!-- ÉRTÉKELÉSEIM -->
    <div class="box">
      <h2>Értékeléseim (<span id="bookCount">0</span>)</h2>
      <div id="booksList"></div>
    </div>

    <!-- AI AJÁNLÓ -->
    <div class="box">
      <h2>AI Mit ajánl nekem?</h2>
      <textarea id="aiPromptExtra" rows="2" placeholder="Opcionális kérés (pl. most valami pörgőset vagy rövidebbet)..."></textarea>
      <div class="row">
        <button type="button" id="askAiBtn">Küldés az AI-nak</button>
        <span id="aiStatus" class="msg"></span>
      </div>
      <div id="aiOutput" class="ai-out">Az AI itt fog válaszolni az összes értékelésed alapján.</div>
    </div>
  </div>
</div>

<script>
(function () {
  // Build lépésben vagy kézzel cserélhető helyőrző a GEMINIAPIKEY secret számára:
  const INJECTED_GEMINI_KEY = "__GEMINIAPIKEY__";
  const ENV_KEY = INJECTED_GEMINI_KEY.startsWith("__") ? "" : INJECTED_GEMINI_KEY;

  const STORAGE_KEY = "konyv_ertekelesek_env_v1";

  const defaultBooks = [
    {
      id: 1,
      title: "Vörös lázadás",
      author: "Pierce Brown",
      rating: "5/5",
      review: "Pörgős, kemény sci-fi, jó karakterek."
    },
    {
      id: 2,
      title: "Piranesi",
      author: "Susanna Clarke",
      rating: "4.5/5",
      review: "Különleges hangulat, rejtélyes világ."
    }
  ];

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const init = { apiKey: ENV_KEY, books: structuredClone(defaultBooks) };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
        return init;
      }
      const parsed = JSON.parse(raw);
      return {
        apiKey: parsed.apiKey || ENV_KEY || "",
        books: Array.isArray(parsed.books) ? parsed.books : []
      };
    } catch {
      return { apiKey: ENV_KEY || "", books: structuredClone(defaultBooks) };
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getActiveKey() {
    return (state.apiKey || ENV_KEY || "").trim();
  }

  function parseMoly(raw) {
    const lines = raw.replace(/\r\n/g, "\n").split("\n").map(s => s.trim()).filter(Boolean);
    let title = lines[0] || "Ismeretlen cím";
    let author = "";
    let rating = "";

    const dash = title.match(/^(.+?)\s+[-–—]\s+(.+)$/);
    if (dash) {
      title = dash[1].trim();
      author = dash[2].trim();
    }

    const rMatch = raw.match(/(\d+(?:[.,]\d+)?\s*\/\s*5|\d+(?:[.,]\d+)?\s*csillag|★+)/i);
    if (rMatch) rating = rMatch[0].trim();

    const bodyLines = lines.slice(1).filter(l => {
      if (author && l === author) return false;
      if (/^szerző\s*:/i.test(l)) {
        author = l.replace(/^szerző\s*:/i, "").trim();
        return false;
      }
      if (/^(\d+(?:[.,]\d+)?\s*\/\s*5|\d+(?:[.,]\d+)?\s*csillag|[★☆\s]+)$/i.test(l)) return false;
      return true;
    });

    return {
      id: Date.now(),
      title,
      author: author || "Ismeretlen szerző",
      rating: rating || "Nincs megadva",
      review: bodyLines.join("\n")
    };
  }

  function renderBooks() {
    document.getElementById("bookCount").textContent = state.books.length;
    const el = document.getElementById("booksList");
    if (!state.books.length) {
      el.innerHTML = "<p class='meta'>Még nincs beírt könyv.</p>";
      return;
    }
    el.innerHTML = state.books.map(b => `
      <div class="book">
        <div class="book-head">
          <span>${esc(b.title)}</span>
          <span>${esc(b.rating)}</span>
        </div>
        <div class="meta">${esc(b.author)}</div>
        ${b.review ? `<div class="review">${esc(b.review)}</div>` : ""}
        <div class="row">
          <button type="button" class="sec" onclick="delBook(${b.id})">Törlés</button>
        </div>
      </div>
    `).join("");
  }

  window.delBook = function (id) {
    state.books = state.books.filter(b => b.id !== id);
    saveState();
    renderBooks();
  };

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, m => ({
      "&": "&", "<": "<", ">": ">", '"': """, "'": "'"
    }[m]));
  }

  document.getElementById("apiKeyInput").value = state.apiKey;
  if (getActiveKey()) {
    document.getElementById("keyStatus").textContent = "Kulcs aktív.";
  }

  document.getElementById("saveKeyBtn").addEventListener("click", () => {
    state.apiKey = document.getElementById("apiKeyInput").value.trim();
    saveState();
    document.getElementById("keyStatus").textContent = getActiveKey() ? "Kulcs elmentve." : "Kulcs törölve.";
  });

  document.getElementById("addMolyBtn").addEventListener("click", () => {
    const inp = document.getElementById("molyInput");
    const st = document.getElementById("molyStatus");
    if (!inp.value.trim()) {
      st.textContent = "Írj vagy illessz be valamit!";
      return;
    }
    const item = parseMoly(inp.value);
    state.books.unshift(item);
    saveState();
    renderBooks();
    inp.value = "";
    st.textContent = `Beírva: ${item.title} (${item.rating})`;
  });

  document.getElementById("askAiBtn").addEventListener("click", async () => {
    const out = document.getElementById("aiOutput");
    const st = document.getElementById("aiStatus");
    const apiKey = getActiveKey();

    if (!apiKey) {
      out.textContent = "Nincs beállítva kulcs. A sima statikus böngészős index.html nem látja automatikusan a secret környezeti változót — add meg a kulcsot a felső mezőben vagy cseréld le build közben.";
      return;
    }

    st.textContent = "Küldés...";
    out.textContent = "Gondolkodom az összes értékelésed alapján...";

    const allReviewsText = state.books.map((b, i) =>
      `${i + 1}. Cím: ${b.title} | Szerző: ${b.author} | Értékelés: ${b.rating}\nVélemény: ${b.review || "(nincs szöveg)"}`
    ).join("\n\n");

    const extra = document.getElementById("aiPromptExtra").value.trim();

    const prompt = [
      "Te egy személyes könyvajánló AI vagy. Az alábbiakban látod a felhasználó ÖSSZES könyvértékelését.",
      "Elemezd ki, mi tetszik neki és mi nem, majd ajánlj neki könyveket, és indokold meg konkrétan a korábbi értékelései alapján.",
      extra ? `Külön kérés: ${extra}` : "",
      "\n--- FELHASZNÁLÓ ÉRTÉKELÉSEI ---\n" + (allReviewsText || "Még nincs értékelés.")
    ].filter(Boolean).join("\n");

    try {
      const resp = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        }
      );

      const json = await resp.json();
      if (!resp.ok) {
        out.textContent = "Hiba a Gemini API-tól: " + (json?.error?.message || resp.status);
        st.textContent = "Hiba";
        return;
      }

      const text = json?.candidates?.[0]?.content?.parts?.[0]?.text || "Nem érkezett szöveges válasz.";
      out.textContent = text;
      st.textContent = "Kész";
    } catch (e) {
      out.textContent = "Hálózati / fetch hiba: " + e.message;
      st.textContent = "Hiba";
    }
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state.books, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "konyv-ertekelesek.json";
    a.click();
  });

  document.getElementById("importBtn").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        state.books = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.books) ? parsed.books : []);
        saveState();
        renderBooks();
      } catch {
        alert("Hibás JSON fájl.");
      }
    };
    r.readAsText(f);
  });

  renderBooks();
})();
</script>
</body>
</html>
